name: clipcascade
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: sathvikrao/clipcascade:latest
    container_name: clipcascade-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      SERVER_PORT: 8080
      BASE_URL: ${BASE_HOST_NAME:-$HOSTNAME}
      AUTH_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      ADMIN_USERNAME: ${APP_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      MAX_MESSAGE_SIZE_MB: ${CC_MAX_MESSAGE_SIZE:-1}
      MAX_FILENAME_LENGTH: 255
      MAX_TOTAL_FILENAME_LENGTH: 1000
      ENABLE_METRICS: false
      CONTAINER_NAME: clipcascade-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/clipcascade:/database'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.clipcascade-app.entrypoints=http'
      - 'traefik.http.routers.clipcascade-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.clipcascade-app.middlewares=clipcascade-app-https-redirect'
      - 'traefik.http.middlewares.clipcascade-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.clipcascade-app-secure.entrypoints=https'
      - 'traefik.http.routers.clipcascade-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.clipcascade-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.clipcascade-app-secure.service=clipcascade-app'
      - 'traefik.http.services.clipcascade-app.loadbalancer.server.port=8080'
    networks:
      - clipcascade
      - traefik

networks:
  clipcascade:
    name: clipcascade
    external: false
  traefik:
    external: true
